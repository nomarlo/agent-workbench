name: pages

# Every plugin with an executable site/build publishes its live demo under /<plugin>/,
# regenerated from the current code on every push, next to the catalog at the root.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build every plugin's site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          for build in plugins/*/site/build; do
            plugin="$(basename "$(dirname "$(dirname "$build")")")"
            echo "::group::$plugin"
            "$build" "_site/$plugin"
            echo "::endgroup::"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
