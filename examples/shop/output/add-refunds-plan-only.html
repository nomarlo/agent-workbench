    $('fl-meta').textContent = (flow.source === 'plan' ? 'Planned flow, drawn in the plan.' : flow.source === 'typescript'
      ? 'Entry ' + flow.label + (flow.why ? ' · ' + flow.why : '') + ' · ✎ marks a changed function · «port» is a call on an interface, its implementations follow as alt branches.'
      : 'From the AST call graph · glyphs: ƒ function · DB query · ⚙ queue · HTTP external call · dashed arrow = private helper.');
    $('fl-src').textContent = text;
    mermaidInto(host, text, {sequence: {useMaxWidth: false, mirrorActors: false, wrap: false}}).then(applyZoom);
  }
  function applyZoom() { $('fl-host').style.transform = 'scale(' + flState.zoom + ')'; }
  function wireFlowSegment(id, apply) {
    Array.prototype.forEach.call($(id).querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () {
        if (id !== 'fl-zoom') Array.prototype.forEach.call($(id).querySelectorAll('button'), function (x) { x.classList.toggle('active', x === b); });
        apply(b.getAttribute('data-v'));
      });
    });
  }
  wireFlowSegment('fl-args', function (v) { flState.args = v; renderFlow(flState.index); });
  wireFlowSegment('fl-priv', function (v) { flState.priv = v === '1'; renderFlow(flState.index); });
  wireFlowSegment('fl-ext', function (v) { flState.ext = v === '1'; renderFlow(flState.index); });
  wireFlowSegment('fl-zoom', function (v) { flState.zoom = v === 'in' ? Math.min(3, flState.zoom * 1.2) : v === 'out' ? Math.max(0.3, flState.zoom / 1.2) : 1; applyZoom(); });
  $('fl-src-toggle').addEventListener('click', function () {
    flState.src = !flState.src;
    $('fl-src').hidden = !flState.src;
    this.classList.toggle('active', flState.src);
  });

  // ---------------------------------------------------------------- contracts
  function renderContracts() {
    var nodes = DATA.nodes.filter(function (n) { return n.build !== 'external' && (n.contract || n.members.length || (n.planned_members || []).length || n.findings.length); })
      .sort(function (a, b) { return rank(a) - rank(b) || DATA.lanes.indexOf(a.layer) - DATA.lanes.indexOf(b.layer) || a.label.localeCompare(b.label); });
    $('contracts-view').innerHTML = nodes.map(function (n) {
      var body;
      if (n.contract) {
        body = n.contract.length ? n.contract.map(function (ex) {
          var head = (ex.changed ? '<span class="chg">✎ </span>' : '') + '<b>' + esc(ex.name) + '</b>' + (ex.kind !== 'value' ? ' <span class="re">' + esc(ex.kind) + '</span>' : '') + (ex.reexport ? ' <span class="re">← ' + esc(ex.reexport.split('/').pop()) + '</span>' : '');
          if (ex.kind === 'interface') return '<div class="m">' + head + '<ul>' + ex.members.map(function (m) { return '<li>' + (m.changed ? '<span class="chg">✎ </span>' : '') + esc(m.name) + ': ' + esc(m.signature) + '</li>'; }).join('') + '</ul></div>';
          return '<div class="m">' + head + (ex.signature ? ': ' + esc(ex.signature) : '') + '</div>';
        }).join('') : '<div class="m re">no exports</div>';
      } else {
        var members = DATA.plan_only ? (n.planned_members || []) : n.members;
        body = members.length ? '<div class="m">' + members.map(function (m) { var i = m.indexOf('('); return '<div>' + (i > 0 ? '<b>' + esc(m.slice(0, i)) + '</b>' + esc(m.slice(i)) : esc(m)) + '</div>'; }).join('') + '</div>' : '';
      }
      var findings = n.findings.length ? '<div class="m"><ul class="find">' + n.findings.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul></div>' : '';
      return '<section class="cbox" style="--lane:' + laneColor(n.layer) + '"><header><h3>' + esc(n.label) + '</h3><div class="cpath">' + esc(n.path) + ' · ' + esc(n.build) + (n.plan ? ' · ' + n.plan : '') + '</div></header>' + body + findings + '</section>';
    }).join('') || '<p class="hint">No extractable members.</p>';
  }

  // ---------------------------------------------------------------- boot
  setTab('components');
  syncSegments();
  renderGraph();
  renderPanel();
})();
</script>
</body>
</html>
